<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
    font-family: 'Arial', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
  }
  .orb1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; }
  .orb2 { width: 300px; height: 300px; background: #a855f7; bottom: -80px; left: -80px; }
  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 80px;
  }
  .badge {
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.5);
    color: #a5b4fc;
    font-size: 22px; font-weight: 600;
    padding: 10px 28px; border-radius: 50px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 48px;
  }
  h1 {
    font-size: 88px; font-weight: 900;
    line-height: 1.0;
    background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #c084fc 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 40px;
  }
  .sub {
    font-size: 32px; color: rgba(255,255,255,0.6);
    font-weight: 400; line-height: 1.5;
    max-width: 760px;
  }
  .sub span { color: #a5b4fc; font-weight: 700; }
  .arrow {
    margin-top: 60px;
    font-size: 38px; color: rgba(255,255,255,0.3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.9} }
  .slide-num {
    position: absolute; bottom: 40px; right: 50px;
    font-size: 20px; color: rgba(255,255,255,0.2);
    font-weight: 600; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="content">
  <div class="badge">AI Agency</div>
  <h1>Your Business<br>Is Losing<br>Leads Right Now</h1>
  <p class="sub">Here are <span>6 automations</span> that run<br>24/7 so you never miss another customer</p>
  <div class="arrow">↓ Swipe to see them</div>
</div>
<div class="slide-num">01 / 08</div>
</body>
</html>
