<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
    font-family: 'Arial', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; }
  .orb1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; }
  .orb2 { width: 300px; height: 300px; background: #a855f7; bottom: -80px; left: -80px; }
  .content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 80px;
  }
  .badge {
    background: rgba(99,102,241,0.2);
    border: 1px solid rgba(99,102,241,0.5);
    color: #a5b4fc;
    font-size: 22px; font-weight: 600;
    padding: 10px 28px; border-radius: 50px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 48px;
  }
  h1 {
    font-size: 78px; font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #c084fc 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 40px;
  }
  .sub {
    font-size: 32px; color: rgba(255,255,255,0.6);
    font-weight: 400; line-height: 1.5;
    max-width: 780px;
  }
  .sub span { color: #a5b4fc; font-weight: 700; }
  .stat-row {
    display: flex; gap: 40px;
    margin-top: 56px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px 36px;
  }
  .stat-num { font-size: 42px; font-weight: 900; color: #a5b4fc; }
  .stat-label { font-size: 18px; color: rgba(255,255,255,0.5); margin-top: 4px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="content">
  <div class="badge">Did You Know</div>
  <h1>78% of Customers<br>Buy From Whoever<br>Replies First</h1>
  <p class="sub">If you're not responding to leads <span>within 5 minutes</span>, you're handing them to a competitor.</p>
  <div class="stat-row">
    <div class="stat">
      <div class="stat-num">5 min</div>
      <div class="stat-label">response window</div>
    </div>
    <div class="stat">
      <div class="stat-num">21x</div>
      <div class="stat-label">higher conversion</div>
    </div>
  </div>
</div>
</body>
</html>
