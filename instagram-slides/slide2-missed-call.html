<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
    font-family: 'Arial', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow-orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
  .orb1 { width: 500px; height: 500px; background: #6366f1; top: -200px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; right: -60px; }
  .content {
    position: relative; z-index: 10;
    width: 100%; padding: 72px 80px;
    display: flex; flex-direction: column;
  }
  .number {
    font-size: 140px; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(99,102,241,0.05));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    position: absolute; top: 40px; right: 60px;
    font-family: 'Arial Black', Arial;
  }
  .icon-wrap {
    width: 90px; height: 90px; border-radius: 24px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; margin-bottom: 36px;
    box-shadow: 0 0 40px rgba(99,102,241,0.4);
  }
  .label {
    font-size: 20px; font-weight: 700; letter-spacing: 3px;
    color: #6366f1; text-transform: uppercase; margin-bottom: 20px;
  }
  h2 {
    font-size: 68px; font-weight: 900; line-height: 1.05;
    color: #fff; margin-bottom: 36px;
  }
  h2 span { background: linear-gradient(135deg,#a5b4fc,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .desc {
    font-size: 28px; color: rgba(255,255,255,0.65);
    line-height: 1.6; max-width: 820px; margin-bottom: 52px;
  }
  .proof-box {
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px; padding: 30px 36px;
    display: flex; align-items: center; gap: 20px;
    max-width: 860px;
  }
  .proof-icon { font-size: 36px; }
  .proof-text { font-size: 24px; color: #a5b4fc; font-weight: 600; line-height: 1.4; }
  .slide-num {
    position: absolute; bottom: 40px; right: 50px;
    font-size: 20px; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="content">
  <div class="number">01</div>
  <div class="icon-wrap">📱</div>
  <div class="label">Automation #1</div>
  <h2>Missed Call<br><span>Text-Back</span></h2>
  <p class="desc">
    Every time someone calls and you can't answer,
    they instantly get a text — keeping them engaged
    before they call your competitor.
  </p>
  <div class="proof-box">
    <div class="proof-icon">💡</div>
    <div class="proof-text">
      "Hey! Sorry we missed you. How can we help?" —<br>
      sent automatically, every single time.
    </div>
  </div>
</div>
<div class="slide-num">02 / 08</div>
</body>
</html>
